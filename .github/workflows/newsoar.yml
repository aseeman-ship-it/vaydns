name: Build Last Net cores

# Put this file at: .github/workflows/build-cores.yml  (on the default branch, e.g. main)
# Run it from: Actions -> "Build Last Net cores" -> Run workflow.
# Output: one artifact per ABI: libslipstream.so and libsoar.so (the Soar core is built from cores/soar-core).
# They are executables named *.so so Android extracts them into nativeLibraryDir.

on:
  workflow_dispatch:
    inputs:
      slipstream_repo:
        description: "Slipstream (Rust) repo"
        default: "Mygod/slipstream-rust"
      slipstream_ref:
        description: "Slipstream branch / tag / commit"
        default: "main"
      build_soar:
        description: "Also build the Soar core (cores/soar-core in this repository)"
        type: boolean
        default: true
      soar_version:
        description: "getlantern/soar version to build against (a tag, e.g. v0.2.4)"
        default: "v0.2.4"

env:
  ANDROID_API: "24"
  NDK_VERSION: "r27c"
  OPENSSL_VERSION: "3.0.15"

jobs:
  # ---------------------------------------------------------------- Slipstream
  slipstream:
    name: slipstream ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            rust: aarch64-linux-android
            clang: aarch64-linux-android
            ossl: android-arm64
          - abi: armeabi-v7a
            rust: armv7-linux-androideabi
            clang: armv7a-linux-androideabi
            ossl: android-arm
          - abi: x86_64
            rust: x86_64-linux-android
            clang: x86_64-linux-android
            ossl: android-x86_64
    steps:
      - name: Checkout slipstream-rust (with picoquic submodule)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.slipstream_repo }}
          ref: ${{ inputs.slipstream_ref }}
          submodules: recursive
          path: src

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config perl make python3 file

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Show what we are building (debug info)
        run: |
          cd src
          git log -1 --oneline || true
          ls
          ls vendor || true
          ls scripts || true
          grep -rn "vendored" --include=Cargo.toml . || true

      - name: Build static OpenSSL for ${{ matrix.abi }}
        run: |
          set -eux
          export ANDROID_NDK_ROOT="${{ steps.ndk.outputs.ndk-path }}"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          PREFIX="$RUNNER_TEMP/openssl-${{ matrix.abi }}"
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar xzf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure "${{ matrix.ossl }}" -D__ANDROID_API__="${ANDROID_API}" \
            no-shared no-tests --prefix="$PREFIX" --openssldir="$PREFIX/ssl"
          make -j"$(nproc)" build_libs
          make install_dev
          LIBSSL="$(find "$PREFIX" -name libssl.a | head -1)"
          test -n "$LIBSSL"
          echo "OSSL_PREFIX=$PREFIX" >> "$GITHUB_ENV"
          echo "OSSL_LIBDIR=$(dirname "$LIBSSL")" >> "$GITHUB_ENV"

      - name: Build slipstream-client
        working-directory: src
        run: |
          set -eux
          export ANDROID_NDK_HOME="${{ steps.ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_ABI="${{ matrix.abi }}"
          export ANDROID_PLATFORM="android-${ANDROID_API}"
          export CMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
          # Use only our own OpenSSL, never the host one.
          export OPENSSL_DIR="$OSSL_PREFIX"
          export OPENSSL_STATIC=1
          export OPENSSL_LIB_DIR="$OSSL_LIBDIR"
          export OPENSSL_INCLUDE_DIR="$OSSL_PREFIX/include"
          export OPENSSL_ROOT_DIR="$OSSL_PREFIX"
          export OPENSSL_SSL_LIBRARY="$OSSL_LIBDIR/libssl.a"
          export OPENSSL_CRYPTO_LIBRARY="$OSSL_LIBDIR/libcrypto.a"
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_LIBDIR="$OSSL_LIBDIR/pkgconfig"
          export PKG_CONFIG_PATH="$OSSL_LIBDIR/pkgconfig"
          # Make the `cc` crate compile the C glue code for Android, not for the host.
          TOOLBIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TRIPLE_ENV="$(echo "${{ matrix.rust }}" | tr '-' '_')"
          test -x "$TOOLBIN/${{ matrix.clang }}${ANDROID_API}-clang"
          export "CC_${TRIPLE_ENV}=$TOOLBIN/${{ matrix.clang }}${ANDROID_API}-clang"
          export "CXX_${TRIPLE_ENV}=$TOOLBIN/${{ matrix.clang }}${ANDROID_API}-clang++"
          export "AR_${TRIPLE_ENV}=$TOOLBIN/llvm-ar"
          # slipstream-ffi/build.rs calls the plain `cc` and `ar` commands (not the cc crate),
          # so they always build for the host. Shim them, but only for that crate's C compile step.
          SHIM="$RUNNER_TEMP/shim-${{ matrix.abi }}"
          mkdir -p "$SHIM"
          export NDK_CC="$TOOLBIN/${{ matrix.clang }}${ANDROID_API}-clang"
          export NDK_AR="$TOOLBIN/llvm-ar"
          cat > "$SHIM/cc" <<'SHIM_EOF'
          #!/bin/sh
          if [ "${CARGO_PKG_NAME:-}" = "slipstream-ffi" ]; then
            for a in "$@"; do
              if [ "$a" = "-c" ]; then exec "$NDK_CC" "$@"; fi
            done
          fi
          exec /usr/bin/cc "$@"
          SHIM_EOF
          cat > "$SHIM/ar" <<'SHIM_EOF'
          #!/bin/sh
          if [ "${CARGO_PKG_NAME:-}" = "slipstream-ffi" ]; then exec "$NDK_AR" "$@"; fi
          exec /usr/bin/ar "$@"
          SHIM_EOF
          chmod +x "$SHIM/cc" "$SHIM/ar"
          export PATH="$SHIM:$PATH"
          which cc ar
          LOG="$GITHUB_WORKSPACE/build-${{ matrix.abi }}.log"
          set +e
          cargo ndk -t "${{ matrix.abi }}" --platform "${ANDROID_API}" build --release -p slipstream-client > "$LOG" 2>&1
          RC=$?
          set -e
          echo "cargo exit code: $RC"
          if [ "$RC" -ne 0 ]; then
            echo "::error::cargo build failed - the real error is printed below (environment dump removed)"
            grep -v -E '^ +[A-Za-z_][A-Za-z_0-9]*="' "$LOG" | tail -n 150
            echo "--- architecture check (should say ARM aarch64 for arm64-v8a)"
            find target -name 'slipstream_poll.c.o' | head -2 | xargs -r file || true
            find .picoquic-build -name '*.a' 2>/dev/null | head -4 | xargs -r file || true
            exit "$RC"
          fi
          tail -n 5 "$LOG"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-log-${{ matrix.abi }}
          path: build-${{ matrix.abi }}.log
          if-no-files-found: ignore

      - name: Package libslipstream.so
        run: |
          set -eux
          BIN="src/target/${{ matrix.rust }}/release/slipstream-client"
          test -f "$BIN"
          mkdir -p "out/${{ matrix.abi }}"
          cp "$BIN" "out/${{ matrix.abi }}/libslipstream.so"
          "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" "out/${{ matrix.abi }}/libslipstream.so"
          file "out/${{ matrix.abi }}/libslipstream.so"
          ls -l "out/${{ matrix.abi }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: slipstream-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/libslipstream.so
          if-no-files-found: error

  # ---------------------------------------------------------------------- Soar
  # The core is cores/soar-core in THIS repository: a small Go program (SOCKS5 proxy on top of the
  # getlantern/soar library). It is built for Android with the NDK's clang (cgo), one file per ABI.
  soar:
    name: soar ${{ matrix.abi }}
    if: ${{ inputs.build_soar }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            clang: aarch64-linux-android
          - abi: armeabi-v7a
            goarch: arm
            clang: armv7a-linux-androideabi
          - abi: x86_64
            goarch: amd64
            clang: x86_64-linux-android
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Check the core's sources are in the repository
        run: |
          set -eux
          test -f cores/soar-core/main.go
          test -f cores/soar-core/go.mod

      - name: Install Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Fetch Soar, check the code compiles, smoke-test it on the host
        working-directory: cores/soar-core
        run: |
          set -eux
          go version
          go get "github.com/getlantern/soar@${{ inputs.soar_version }}"
          go mod tidy
          go vet ./...
          go build -o "$RUNNER_TEMP/soar-core-host" .
          "$RUNNER_TEMP/soar-core-host" -version

      - name: Smoke test on the host - the SOCKS5 greeting is answered
        continue-on-error: true
        run: |
          set -eu
          BIN="$RUNNER_TEMP/soar-core-host"
          # A zero key and an unreachable resolver: no tunnel, but the local SOCKS5 side must answer.
          "$BIN" -zone t.example.com -pubkey AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
                 -resolver 127.0.0.1:9 -listen 127.0.0.1:18836 -dial-timeout 3s > "$RUNNER_TEMP/smoke.log" 2>&1 &
          PID=$!
          sleep 1
          exec 3<>/dev/tcp/127.0.0.1/18836
          printf '\x05\x01\x00' >&3
          REPLY="$(head -c 2 <&3 | od -An -tx1 | tr -d ' \n')"
          echo "greeting reply: $REPLY (want 0500)"
          kill "$PID" 2>/dev/null || true
          cat "$RUNNER_TEMP/smoke.log" || true
          test "$REPLY" = "0500"

      - name: Build libsoar.so for ${{ matrix.abi }}
        working-directory: cores/soar-core
        run: |
          set -eux
          TOOLBIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLBIN/${{ matrix.clang }}${ANDROID_API}-clang"
          export CXX="$TOOLBIN/${{ matrix.clang }}${ANDROID_API}-clang++"
          test -x "$CC"
          export CGO_ENABLED=1
          export GOOS=android
          export GOARCH="${{ matrix.goarch }}"
          if [ "$GOARCH" = "arm" ]; then export GOARM=7; fi
          OUT="$GITHUB_WORKSPACE/out/${{ matrix.abi }}"
          mkdir -p "$OUT"
          # 16 KB page alignment, as Android 15+ devices and Play expect for native files.
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::8} -extldflags=-Wl,-z,max-page-size=16384" \
            -o "$OUT/libsoar.so" .
          file "$OUT/libsoar.so"
          "$TOOLBIN/llvm-readelf" -h "$OUT/libsoar.so" | grep -E 'Class|Machine|Type'
          "$TOOLBIN/llvm-readelf" -d "$OUT/libsoar.so" | grep NEEDED || true
          ls -l "$OUT"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: soar-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/libsoar.so
          if-no-files-found: error
